name: check-caddy

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - modules.txt
      - .github/workflows/check.yml
      - .github/workflows/build.yml

# The called workflow can't have more permissions than this
permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: caddy-image
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      image: ${{ steps.v.outputs.image }}
      caddy: ${{ steps.v.outputs.caddy }}
      with: ${{ steps.v.outputs.with }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest versions
        id: v
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/caddy-custom"

          docker pull -q caddy:latest
          BASE_DIGEST=$(docker buildx imagetools inspect caddy:latest --format '{{.Manifest.Digest}}')
          CADDY=$(docker run --rm caddy:latest caddy version | awk '{print $1}' | sed 's/^v//')

          WITH=""
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            if [[ "$line" == *@* ]]; then
              spec="$line"
            else
              spec="$line@$(go list -m -f '{{.Version}}' "$line@latest")"
            fi
            WITH="$WITH --with $spec"
          done < modules.txt

          HASH=$(printf '%s%s' "$BASE_DIGEST" "$WITH" | sha256sum | cut -c1-8)
          {
            echo "image=$IMAGE"
            echo "caddy=$CADDY"
            echo "with=$WITH"
            echo "tag=$CADDY-$HASH"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        env:
          REF: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced build ($EVENT)"
          elif docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$REF already exists, nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New base image or module versions, building $REF"
          fi

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/enable" || true

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ needs.check.outputs.image }}
      caddy: ${{ needs.check.outputs.caddy }}
      with: ${{ needs.check.outputs.with }}
      tag: ${{ needs.check.outputs.tag }}
