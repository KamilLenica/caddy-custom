name: 2. Execute Caddy Compilation

on:
  workflow_call:
    inputs:
      caddy_tag:
        required: true
        type: string
      clean_tag:
        required: true
        type: string
      low_image:
        required: true
        type: string

jobs:
  compile-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        - name: Wygeneruj argumenty modułów z ukośnikami
        id: caddy_args
        run: |
          ARGS=""
          
          while read -r line || [ -n "$line" ]; do
            clean=$(echo "$line" | tr -d '\r' | xargs)
            [[ -z "$clean" || "$clean" =~ ^# ]] && continue
            
            # Zbieramy argumenty w jeden ciąg tekstowy
            ARGS="$ARGS --with $clean"
          done < modules.txt
          
          # xargs usunie zbędne białe znaki i entery, robiąc z tego jedną linię
          FINAL_ARGS=$(echo "$ARGS" | xargs)
          
          echo "=== WYGENEROWANA LINIA DLA DOCKERA ==="
          echo "$FINAL_ARGS"
          echo "======================================="
          
          # Zapisujemy jako zwykłą, jedno-liniową zmienną środowiskową
          echo "modules_string=$FINAL_ARGS" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx Environment
        uses: docker/setup-buildx-action@v3

      - name: Build and push final production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            XCADDY_MODULES=${{ env.modules_string }}
          tags: |
            ghcr.io/${{ inputs.low_image }}:latest
            ghcr.io/${{ inputs.low_image }}:${{ inputs.caddy_tag }}
