name: Build Custom Caddy

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'modules.txt'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Pobranie kodu Twojego repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pobranie najnowszego stabilnego tagu Caddy (np. v2.11.7) przez oficjalną akcję
      - name: Fetch latest Caddy version
        id: caddy_version
        uses: oprypin/find-latest-tag@v1
        with:
          repository: caddyserver/caddy
          releases-only: true

      # 3. Sprawdzenie najnowszych commitów dla wtyczek za pomocą czystego Gita (Bez Go, bez dwukropków)
      - name: Check modules updates via Git
        id: tracker
        run: |
          # Zapisujemy wersję Caddy do tymczasowego pliku stanu
          echo "caddy=${{ steps.caddy_version.outputs.tag }}" > current_state.txt
          
          # Pobieramy najnowszy commit SHA dla każdego modułu z modules.txt
          while IFS= read -r raw_module || [ -n "$raw_module" ]; do
            module=$(echo "$raw_module" | tr -d '\r' | xargs)
            if [ -n "$module" ] && [[ ! "$module" =~ ^# ]]; then
              echo "Sprawdzam modul $module"
              # Pobiera najnowszy commit z domyślnego brancha wtyczki
              SHA=$(git ls-remote "https://$module" HEAD | awk '{print $1}')
              echo "$module=$SHA" >> current_state.txt
            fi
          done < modules.txt
          
          # Obliczamy hash z pliku stanu
          CURRENT_HASH=$(sha256sum current_state.txt | awk '{print $1}')
          echo "Bieżący hash sygnatury: $CURRENT_HASH"
          echo "current_hash=$CURRENT_HASH" >> $GITHUB_OUTPUT

      # 4. Odczytanie poprzedniego hashu (jeśli istnieje)
      - name: Read previous signature
        id: old_tracker
        run: |
          OLD_HASH=""
          if [ -f .github/last_build_hash.txt ]; then
            OLD_HASH=$(cat .github/last_build_hash.txt)
          fi
          echo "Poprzedni hash sygnatury: $OLD_HASH"
          echo "old_hash=$OLD_HASH" >> $GITHUB_OUTPUT

      # 5. Podjęcie decyzji o budowaniu
      - name: Evaluate build decision
        id: decision
        run: |
          CURR="${{ steps.tracker.outputs.current_hash }}"
          PREV="${{ steps.old_tracker.outputs.old_hash }}"
          
          if [ "$CURR" != "$PREV" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "Wykryto zmiany lub ręczne uruchomienie. Rozpoczynam budowanie."
            echo "should_build=true" >> $GITHUB_OUTPUT
            mkdir -p .github
            echo "$CURR" > .github/last_build_hash.txt
          else
            echo "Brak zmian. Pomijam proces."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      # 6. Zapisanie nowego hashu w Twoim repozytorium
      - name: Commit and push new signature hash
        if: steps.decision.outputs.should_build == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/last_build_hash.txt
          git commit -m "chore: update dependency tracker [skip ci]" || exit 0
          git push

      # 7. Logowanie do rejestru kontenerów GitHub Packages (GHCR)
      - name: Log in to the Container registry
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Konfiguracja buildera Docker Buildx
      - name: Set up Docker Buildx
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      # 9. Kompilacja obrazu Docker i wysłanie do Twojego profilu Packages (Bezpieczne przekazanie wersji)
      - name: Build and push Docker image
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: CADDY_VERSION=${{ steps.caddy_version.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.caddy_version.outputs.tag }}
