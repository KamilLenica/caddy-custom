name: Build Custom Caddy

on:
  schedule:
    # Uruchamia sprawdzenie automatycznie co godzinę
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'modules.txt'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch: # Pozwala na ręczne wymuszenie budowania z panelu Actions

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Pobranie kodu z Twojego repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalacja środowiska Go na maszynie wirtualnej
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # 3. Dynamiczne wygenerowanie pliku go.mod w celu sprawdzenia zależności
      - name: Check for updates of Caddy and modules
        id: check_updates
        run: |
          CADDY_TAG=$(curl -sL -H "Accept: application/vnd.github+json" https://github.com | jq -r '.tag_name')
          
          if [ -z "$CADDY_TAG" ] || [ "$CADDY_TAG" == "null" ]; then
            echo "Blad: Nie udalo sie pobrac poprawnego tagu Caddy z API GitHub."
            exit 1
          fi
          
          echo "Wykryty tag Caddy: $CADDY_TAG"
          echo "caddy_tag=$CADDY_TAG" >> $GITHUB_OUTPUT
          
          mkdir tracker && cd tracker
          go mod init caddy-tracker
          go get ://github.com
          
          while IFS= read -r raw_module || [ -n "$raw_module" ]; do
            # Usuniecie znakow powrotu karetki \r (Windows compatibility) i spacji
            module=$(echo "$raw_module" | tr -d '\r' | xargs)
            
            [[ -z "$module" || "$module" =~ ^# ]] && continue
            echo "Sprawdzam najnowszą wersję modułu: $module"
            go get "$module"@latest
          done < ../modules.txt
          
          CURRENT_HASH=$(sha256sum go.sum | awk '{print $1}')
          echo "Bieżący hash zależności: $CURRENT_HASH"
          
          OLD_HASH=""
          if [ -f ../.github/last_build_hash.txt ]; then
            OLD_HASH=$(cat ../.github/last_build_hash.txt)
          fi
          echo "Poprzedni hash zależności: $OLD_HASH"
          
          if [ "$CURRENT_HASH" != "$OLD_HASH" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "Wykryto nowe wydanie Caddy lub aktualizację modułów! Uruchamiam kompilację."
            echo "should_build=true" >> $GITHUB_OUTPUT
            mkdir -p ../.github
            echo "$CURRENT_HASH" > ../.github/last_build_hash.txt
          else
            echo "Brak zmian w Caddy oraz modułach zewnętrznych. Pomijam budowanie."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      # 4. Zapisanie nowego haszu w repozytorium (wymaga uprawnień zapisu w Settings repozytorium)
      - name: Commit and push new version hash
        if: steps.check_updates.outputs.should_build == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/last_build_hash.txt
          git commit -m "chore: update dependency hash tracker [skip ci]" || exit 0
          git push

      # 5. Logowanie do GitHub Packages (GHCR)
      - name: Log in to the Container registry
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Konfiguracja buildera Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      # 7. Kompilacja obrazu Docker i wysłanie do ghcr.io
      - name: Build and push Docker image
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.check_updates.outputs.caddy_tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.check_updates.outputs.caddy_tag }}
