name: 2. Execute Caddy Compilation

on:
  workflow_call:
    inputs:
      caddy_tag:
        required: true
        type: string
      clean_tag:
        required: true
        type: string
      low_image:
        required: true
        type: string

jobs:
  compile-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wygeneruj argumenty modułów z ukośnikami
        id: caddy_args
        run: |
          # Inicjalizacja pustego ciągu dla modułów
          ARGS=""
          
          # Odczyt pliku tekstowego modules.txt linia po linii
          while read -r line || [ -n "$line" ]; do
            clean=$(echo "$line" | tr -d '\r' | xargs)
            
            # Pomijanie linii pustych i komentarzy
            [[ -z "$clean" || "$clean" =~ ^# ]] && continue
            
            # Doklejanie kolejnych modułów z jawnym ukośnikiem i znakiem nowej linii
            ARGS="$ARGS --with $clean \\\n"
          done < modules.txt
          
          # Usuwamy ostatni ukośnik z końca stringa, aby polecenie nie miało błędu składni
          ARGS=$(echo -e "$ARGS" | sed 's/\\\s*$//')
          
          echo "=== WYGENEROWANY STRING DLA DOCKERA ==="
          echo -e "$ARGS"
          echo "======================================="
          
          # Zapisujemy do formatu wielolinijkowego w GitHub Actions Environment
          echo "modules_string<<EOF" >> $GITHUB_ENV
          echo -e "$ARGS"
          echo "EOF" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx Environment
        uses: docker/setup-buildx-action@v3

      - name: Build and push final production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            XCADDY_MODULES=${{ env.modules_string }}
          tags: |
            ghcr.io/${{ inputs.low_image }}:latest
            ghcr.io/${{ inputs.low_image }}:${{ inputs.caddy_tag }}
