name: Build Custom Caddy

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'modules.txt'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Pobranie kodu repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pobranie najnowszego stabilnego tagu Caddy przez dedykowaną akcję
      - name: Fetch latest Caddy version
        id: caddy_version
        uses: oprypin/find-latest-tag@v1
        with:
          repository: caddyserver/caddy
          releases-only: true

      # 3. Instalacja środowiska Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # 4. Przygotowanie czystego środowiska śledzenia wersji Go
      - name: Initialize Go tracker module
        run: |
          mkdir tracker && cd tracker
          go mod init caddy-tracker
          go get "://github.com{{ steps.caddy_version.outputs.tag }}"

      # 5. Iteracyjne pobieranie wtyczek z pliku modules.txt
      - name: Resolve custom modules from modules.txt
        run: |
          cd tracker
          while IFS= read -r raw_module || [ -n "$raw_module" ]; do
            module=$(echo "$raw_module" | tr -d '\r' | xargs)
            if [ -n "$module" ] && [[ ! "$module" =~ ^# ]]; then
              echo "Sprawdzanie aktualizacji dla modułu: $module"
              go get "${module}@latest"
            fi
          done < ../modules.txt

      # 6. Obliczanie bieżącej sumy kontrolnej zależności
      - name: Compute dependencies checksum
        id: checksum
        run: |
          CURRENT_HASH=$(sha256sum tracker/go.sum | awk '{print $1}')
          echo "Bieżący hash: $CURRENT_HASH"
          echo "current_hash=$CURRENT_HASH" >> $GITHUB_OUTPUT

      # 7. Odczytanie poprzedniego zapisanego haszu
      - name: Read previous dependencies checksum
        id: old_checksum
        run: |
          OLD_HASH=""
          if [ -f .github/last_build_hash.txt ]; then
            OLD_HASH=$(cat .github/last_build_hash.txt)
          fi
          echo "Poprzedni hash: $OLD_HASH"
          echo "old_hash=$OLD_HASH" >> $GITHUB_OUTPUT

      # 8. Podjęcie decyzji o uruchomieniu kompilacji
      - name: Evaluate if build is required
        id: decision
        run: |
          CURR="${{ steps.checksum.outputs.current_hash }}"
          PREV="${{ steps.old_checksum.outputs.old_hash }}"
          EVENT="${{ github.event_name }}"
          
          if [ "$CURR" != "$PREV" ] || [ "$EVENT" == "workflow_dispatch" ] || [ "$EVENT" == "push" ]; then
            echo "Wykryto zmiany, ręczne wymuszenie lub push. Zezwalam na kompilację."
            echo "should_build=true" >> $GITHUB_OUTPUT
            mkdir -p .github
            echo "$CURR" > .github/last_build_hash.txt
          else
            echo "Brak zmian. Kompilacja pominięta."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      # 9. Aktualizacja pliku hashu w Twoim repozytorium (wymaga uprawnień zapisu w Settings)
      - name: Commit and push new version hash
        if: steps.decision.outputs.should_build == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/last_build_hash.txt
          git commit -m "chore: update dependency hash tracker [skip ci]" || exit 0
          git push

      # 10. Logowanie do profilu GitHub Packages (GHCR)
      - name: Log in to the Container registry
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 11. Konfiguracja zaawansowanego mechanizmu Docker Buildx
      - name: Set up Docker Buildx
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      # 12. Kompilacja obrazu Docker i wysłanie do Twojego profilu Packages
      - name: Build and push Docker image
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy_version.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.caddy_version.outputs.tag }}
