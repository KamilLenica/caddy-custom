name: 2. Execute Caddy Compilation

on:
  workflow_call:
    inputs:
      caddy_tag:
        required: true
        type: string
      clean_tag:
        required: true
        type: string
      low_image:
        required: true
        type: string

jobs:
  compile-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install xcaddy compiler
        run: go install ://github.com

      - name: Dynamiczne budowanie komendy kompilacji (z formatowaniem \)
        run: |
          # Inicjalizacja bazowego polecenia z wymaganą wersją rdzenia Caddy
          CMD="xcaddy build ${{ inputs.caddy_tag }}"
          
          # Odczyt pliku tekstowego modules.txt linia po linii
          while read -r line || [ -n "$line" ]; do
            clean=$(echo "$line" | tr -d '\r' | xargs)
            
            # Pomijanie linii pustych i komentarzy
            [[ -z "$clean" || "$clean" =~ ^# ]] && continue
            
            # Doklejanie kolejnych modułów z zachowaniem znaku \
            CMD="$CMD \\\n  --with $clean"
          done < modules.txt
          
          # Renderowanie ostatecznego ciągu znaków w powłoce Bash
          CMD=$(echo -e "$CMD")
          
          echo "=== WYGENEROWANE POLECENIE BASH ==="
          echo "$CMD"
          echo "===================================="
          
          # Wykonanie utworzonej dynamicznie instrukcji kompilacji
          eval "$CMD"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx Environment
        uses: docker/setup-buildx-action@v3

      - name: Build and push final production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: CADDY_VERSION=${{ inputs.clean_tag }}
          tags: |
            ghcr.io/${{ inputs.low_image }}:latest
            ghcr.io/${{ inputs.low_image }}:${{ inputs.caddy_tag }}
