name: build-image

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      caddy:
        type: string
        required: true
      with:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          build-args: |
            CADDY_VERSION=${{ inputs.caddy }}
            XCADDY_WITH=${{ inputs.with }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/leniek/custom-caddy:latest
            ${{ inputs.image }}:latest
            ${{ inputs.image }}:${{ inputs.tag }}
