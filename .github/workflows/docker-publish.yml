name: build-caddy
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, modules.txt, .github/workflows/build.yml]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/youruser/caddy-custom   # must be lowercase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CADDY=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name | sed 's/^v//')
          WITH=""
          while read -r mod; do
            [ -z "$mod" ] && continue
            ver=$(go list -m -f '{{.Version}}' "$mod@latest")
            WITH="$WITH --with $mod@$ver"
          done < modules.txt
          HASH=$(echo "$CADDY$WITH" | sha256sum | cut -c1-8)
          echo "caddy=$CADDY" >> "$GITHUB_OUTPUT"
          echo "with=$WITH" >> "$GITHUB_OUTPUT"
          echo "tag=$CADDY-$HASH" >> "$GITHUB_OUTPUT"

      - name: Already built?
        id: exists
        if: github.event_name == 'schedule'
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          pull: true
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.v.outputs.caddy }}
            XCADDY_WITH=${{ steps.v.outputs.with }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
